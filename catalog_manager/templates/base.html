<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catalog Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260506a') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="sidebar-brand" href="{{ url_for('index') }}">
        <span class="brand-dot"></span>
        <span>Catalog Manager</span>
      </a>
      <nav class="sidebar-nav">
        <a class="sidebar-item {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}"><span class="ico"></span>Dashboard</a>
        <a class="sidebar-item {% if request.path.startswith('/catalogues') %}active{% endif %}" href="{{ url_for('catalogues_page') }}"><span class="ico"></span>Catalogs</a>
        <a class="sidebar-item {% if request.path.startswith('/product') %}active{% endif %}" href="{{ url_for('create_product') }}"><span class="ico"></span>Products</a>
        <a class="sidebar-item" href="{{ url_for('index') }}"><span class="ico"></span>Categories</a>
        <a class="sidebar-item" href="{{ url_for('index') }}"><span class="ico"></span>Shopify Sync</a>
        <a class="sidebar-item" href="{{ url_for('index') }}"><span class="ico"></span>Analytics</a>
        <a class="sidebar-item" href="{{ url_for('index') }}"><span class="ico"></span>Activity</a>
        <a class="sidebar-item {% if request.path.startswith('/settings') %}active{% endif %}" href="{{ url_for('settings_page') }}"><span class="ico"></span>Settings</a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="top-nav modern-top-nav">
        <div class="top-left">
          {% if request.path != '/' %}
            <button
              type="button"
              class="btn btn-blue"
              onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '/'; }"
            >
              ← Back
            </button>
          {% endif %}
          <div class="global-search">Search products, actions, pages...</div>
        </div>
        <nav class="top-links">
          <form method="post" action="{{ url_for('switch_catalogue') }}" class="catalogue-switch-form">
            <label for="catalogue_id" class="top-filter-label">Catalogue:</label>
            <select id="catalogue_id" name="catalogue_id" onchange="this.form.submit()">
              {% for c in available_catalogues %}
                <option value="{{ c.id }}" {% if c.id == current_catalogue_id %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </form>
          <a class="btn btn-light" href="{{ url_for('catalogues_page') }}">Manage Catalogues</a>
          <button class="btn btn-light" type="button">Notifications</button>
          <button class="btn btn-light" type="button">Profile</button>
        </nav>
      </header>
      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="{{ url_for('static', filename='app.js', v='20260506a') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
